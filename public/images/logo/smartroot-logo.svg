<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="60%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- SmartRoot Emblem: Connected root node / Circuit -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#0B2545" />
    <circle cx="30" cy="18" r="5" fill="#00D2FF" filter="url(#glow)" />
    <circle cx="16" cy="42" r="4.5" fill="#0066FF" />
    <circle cx="44" cy="42" r="4.5" fill="#00D2FF" />
    <path d="M30 23 L30 33 L16 37.5 M30 33 L44 37.5 M30 33 L30 50" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="30" cy="50" r="3.5" fill="#388BFD" />
  </g>

  <!-- Typography -->
  <text x="82" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#0B2545" letter-spacing="-0.5">Smart<tspan fill="#0066FF">Root</tspan></text>
  <text x="84" y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="3.5">TECNOLOGIA &amp; INOVAÇÃO</text>
</svg>
