      <stop offset="0%" stop-color="#082136"/>
      <stop offset="100%" stop-color="#05121F"/>
    </linearGradient>
  </defs>
  <rect width="640" height="420" rx="18" fill="url(#gProj3)"/>
  <g transform="translate(60, 40)">
    <!-- VR Visor / Virtual Panel Simulator Frame -->
    <rect x="20" y="30" width="480" height="260" rx="16" fill="#0E1927" stroke="#388BFD" stroke-width="2"/>
