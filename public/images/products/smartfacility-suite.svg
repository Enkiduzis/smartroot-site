<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09213D" />
      <stop offset="100%" stop-color="#06162A" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#p2Grad)"/>
  
  <!-- Dashboard UI Mockup -->
  <g transform="translate(60, 40)">
    <!-- Main Window Frame -->
    <rect x="0" y="0" width="480" height="300" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="480" height="36" rx="14" fill="#1E293B"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="80" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">SmartFacility Suite v4.2 • Central de Gestão Predial</text>
    
    <!-- Sidebar -->
    <rect x="0" y="36" width="100" height="264" fill="#0A0F1D"/>
    <rect x="12" y="52" width="76" height="18" rx="4" fill="#0066FF"/>
    <rect x="12" y="78" width="76" height="14" rx="4" fill="#1E293B"/>
    <rect x="12" y="100" width="76" height="14" rx="4" fill="#1E293B"/>
    <rect x="12" y="122" width="76" height="14" rx="4" fill="#1E293B"/>
    
    <!-- Content Cards -->
    <!-- Card 1: Energy -->
    <rect x="115" y="50" width="170" height="110" rx="8" fill="#1E293B"/>
    <text x="128" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Consumo Geral</text>
    <text x="128" y="98" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#10B981">-24.8% kWh</text>
    <path d="M128 135 L160 120 L200 130 L240 105 L270 115" stroke="#10B981" stroke-width="2.5" fill="none"/>
    
    <!-- Card 2: Clima -->
    <rect x="295" y="50" width="170" height="110" rx="8" fill="#1E293B"/>
    <text x="308" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Climatização Ativa</text>
    <text x="308" y="98" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#00D2FF">22.4°C Estável</text>
    <circle cx="435" cy="90" r="18" stroke="#00D2FF" stroke-width="3" fill="none"/>
    
    <!-- Card 3: Access logs -->
    <rect x="115" y="170" width="350" height="110" rx="8" fill="#1E293B"/>
    <text x="128" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Logs de Acesso em Tempo Real (Catracas &amp; Portais)</text>
    <line x1="128" y1="210" x2="450" y2="210" stroke="#334155" stroke-width="1"/>
    <text x="128" y="230" font-family="monospace" font-size="10" fill="#10B981">● 14:32:10 - Portaria Sul: Acesso Autorizado (ID #8824)</text>
    <text x="128" y="248" font-family="monospace" font-size="10" fill="#388BFD">● 14:32:05 - Data Center: Biometria Confirmada (Admin)</text>
    <text x="128" y="266" font-family="monospace" font-size="10" fill="#94A3B8">● 14:31:58 - Garagem G2: Sensor de Vagas Atualizado</text>
