<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051D14"/>
      <stop offset="100%" stop-color="#0A3828"/>
    </linearGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#pcbBg)"/>

  <!-- PCB Board outline -->
  <rect x="80" y="50" width="440" height="300" rx="16" fill="#062B1E" stroke="#10B981" stroke-width="2" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.6))"/>

  <!-- Corner Mounting Holes -->
  <circle cx="105" cy="75" r="8" fill="#041810" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="495" cy="75" r="8" fill="#041810" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="105" cy="325" r="8" fill="#041810" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="495" cy="325" r="8" fill="#041810" stroke="#F59E0B" stroke-width="2"/>

  <!-- Copper Circuit Traces -->
  <g stroke="#10B981" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M105 150 L160 150 L190 180 L240 180"/>
    <path d="M105 180 L140 180 L160 200 L240 200"/>
    <path d="M105 210 L150 210 L170 230 L240 230"/>
    
    <path d="M360 180 L420 180 L440 150 L495 150"/>
    <path d="M360 200 L430 200 L450 180 L495 180"/>
    <path d="M360 220 L420 220 L440 250 L495 250"/>

    <path d="M280 110 L280 140"/>
    <path d="M320 110 L320 140"/>
    <path d="M280 260 L280 290"/>
    <path d="M320 260 L320 290"/>
  </g>

  <!-- Central Microcontroller Chip (QFN / BGA) -->
  <rect x="240" y="140" width="120" height="120" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="255" cy="155" r="4" fill="#38BDF8"/>
  <text x="300" y="195" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">SMARTROOT</text>
  <text x="300" y="212" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">MCU-PCB-PRO</text>
  <text x="300" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">MULTILAYER • DFM OK</text>

  <!-- Golden Vias & Test Points -->
  <circle cx="160" cy="150" r="3" fill="#F59E0B"/>
  <circle cx="190" cy="180" r="3" fill="#F59E0B"/>
  <circle cx="420" cy="180" r="3" fill="#F59E0B"/>
  <circle cx="440" cy="150" r="3" fill="#F59E0B"/>

  <!-- Badges at Top & Bottom -->
  <rect x="180" y="70" width="240" height="26" rx="8" fill="#041A12" stroke="#10B981" stroke-width="1"/>
  <text x="300" y="87" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">DESIGN DE CIRCUITOS &amp; GERBER FINALIZADO</text>
</svg>
