<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082338" />
      <stop offset="100%" stop-color="#051522" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#p3Grad)"/>
  
  <!-- Educational Simulator & Virtual Lab -->
  <g transform="translate(80, 50)">
    <!-- 3D Hologram / Workstation outline -->
    <rect x="0" y="0" width="440" height="280" rx="16" fill="#0C1B2A" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="6 2"/>
    
    <!-- Virtual Circuit / Logic trainer -->
    <g transform="translate(40, 40)">
      <!-- Microcontroller simulation block -->
      <rect x="0" y="30" width="120" height="140" rx="10" fill="#1E293B" stroke="#388BFD" stroke-width="2"/>
      <text x="15" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#00D2FF">MCU TRAINER</text>
      <text x="15" y="80" font-family="monospace" font-size="10" fill="#94A3B8">GPIO 1-16: OK</text>
      <text x="15" y="98" font-family="monospace" font-size="10" fill="#94A3B8">PWM 0-4: RUN</text>
      <circle cx="25" cy="130" r="6" fill="#10B981"/>
      <circle cx="45" cy="130" r="6" fill="#F59E0B"/>
      <circle cx="65" cy="130" r="6" fill="#388BFD"/>
      
      <!-- Virtual oscilloscope & waveform -->
      <rect x="150" y="30" width="210" height="140" rx="10" fill="#060D17" stroke="#1E293B" stroke-width="2"/>
      <path d="M160 100 Q180 60 200 100 T240 100 T280 100 T320 100 T350 100" stroke="#00D2FF" stroke-width="2.5" fill="none"/>
      <text x="165" y="55" font-family="monospace" font-size="11" fill="#10B981">OSCILLOSCOPE CH1: 2.4kHz</text>
      
      <!-- Connectors / Virtual Wires -->
      <path d="M120 70 C135 70, 135 85, 150 85" stroke="#F59E0B" stroke-width="2" fill="none"/>
      <path d="M120 110 C135 110, 135 125, 150 125" stroke="#10B981" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Footer status -->
    <text x="40" y="240" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">EduSimulate Pro — Bancada Virtual Interativa</text>
    <text x="40" y="260" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Ambiente de experimentação segura com física e lógica em tempo real</text>
  </g>
</svg>
