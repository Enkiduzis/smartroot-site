<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05192D"/>
      <stop offset="100%" stop-color="#0A2F50"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3860"/>
      <stop offset="100%" stop-color="#072038"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>

  <!-- Process Workflow Cards -->
  <!-- Step 1: Edital & Inscrição -->
  <rect x="50" y="110" width="140" height="190" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.4))"/>
  <circle cx="80" cy="140" r="16" fill="#38BDF8" fill-opacity="0.2"/>
  <text x="80" y="145" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">1</text>
  <text x="70" y="180" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Edital &amp; Barema</text>
  <text x="70" y="200" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Inscrição Candidato</text>
  <text x="70" y="216" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Upload Comprovantes</text>
  <text x="70" y="232" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Criptografia LGPD</text>
  <rect x="70" y="252" width="80" height="18" rx="6" fill="#38BDF8" fill-opacity="0.15"/>
  <text x="76" y="265" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">PONTUAÇÃO</text>

  <!-- Flow Connector 1 -->
  <path d="M190 205 L230 205" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="230,201 238,205 230,209" fill="#38BDF8"/>

  <!-- Step 2: Avaliação & Banca -->
  <rect x="230" y="100" width="140" height="210" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="2" filter="drop-shadow(0 12px 25px rgba(0,0,0,0.5))"/>
  <circle cx="260" cy="130" r="16" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="260" y="135" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">2</text>
  <text x="250" y="170" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Banca &amp; Recursos</text>
  <text x="250" y="190" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Fase Deferimento</text>
  <text x="250" y="206" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Fase do Mérito</text>
  <text x="250" y="222" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Julgamento Online</text>
  <text x="250" y="238" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Convocação E-mail</text>
  <rect x="250" y="260" width="90" height="18" rx="6" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="256" y="273" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9" font-weight="600">HABILITAÇÃO</text>

  <!-- Flow Connector 2 -->
  <path d="M370 205 L410 205" stroke="#10B981" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="410,201 418,205 410,209" fill="#10B981"/>

  <!-- Step 3: Tarefas & Folha Pagamento -->
  <rect x="410" y="110" width="140" height="190" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.4))"/>
  <circle cx="440" cy="140" r="16" fill="#10B981" fill-opacity="0.2"/>
  <text x="440" y="145" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">3</text>
  <text x="430" y="180" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Folha de Bolsas</text>
  <text x="430" y="200" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Alocação no Moodle</text>
  <text x="430" y="216" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Conflito de Agendas</text>
  <text x="430" y="232" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Assinatura Digital</text>
  <rect x="430" y="252" width="76" height="18" rx="6" fill="#10B981" fill-opacity="0.2"/>
  <text x="436" y="265" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">QR CODE PDF</text>

  <!-- Top Ribbon Header -->
  <rect x="160" y="45" width="280" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="300" y="66" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SELECION AND PAYMENT • PLUGIN MOODLE</text>
</svg>
