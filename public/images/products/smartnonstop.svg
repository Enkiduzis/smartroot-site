<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041224"/>
      <stop offset="100%" stop-color="#082240"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="galeraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#nsBg)"/>

  <!-- Background grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <circle cx="300" cy="200" r="160" fill="none" stroke-dasharray="4 4"/>
    <circle cx="300" cy="200" r="90" fill="none" stroke-dasharray="2 4"/>
  </g>

  <!-- Level 1: Cloudflare DNS Load Balancer (Top) -->
  <rect x="210" y="40" width="180" height="46" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" filter="drop-shadow(0 6px 15px rgba(245,158,11,0.25))"/>
  <circle cx="230" cy="63" r="7" fill="#F59E0B"/>
  <text x="245" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cloudflare DNS</text>
  <text x="245" y="73" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Load Balance &amp; Health Check</text>

  <!-- Connection Lines from DNS to Managers -->
  <path d="M260 86 L140 130" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M300 86 L300 130" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M340 86 L460 130" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Level 2: 3 Manager VPS (Reverse Proxy, NGINX, Portainer) -->
  <g id="managers">
    <rect x="70" y="130" width="130" height="60" rx="10" fill="#0B2139" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="82" y="152" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Manager 1</text>
    <text x="82" y="166" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">NGINX Proxy Mgr</text>
    <text x="82" y="178" fill="#10B981" font-family="system-ui, sans-serif" font-size="8" font-weight="600">● ATIVO (SSL/Cache)</text>

    <rect x="235" y="130" width="130" height="60" rx="10" fill="#0B2139" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="247" y="152" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Manager 2</text>
    <text x="247" y="166" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Docker Swarm Leader</text>
    <text x="247" y="178" fill="#10B981" font-family="system-ui, sans-serif" font-size="8" font-weight="600">● ATIVO (Portainer)</text>

    <rect x="400" y="130" width="130" height="60" rx="10" fill="#0B2139" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="412" y="152" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Manager 3</text>
    <text x="412" y="166" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Failover Automático</text>
    <text x="412" y="178" fill="#10B981" font-family="system-ui, sans-serif" font-size="8" font-weight="600">● ATIVO (Redundante)</text>
  </g>

  <!-- Mid level: ProxySQL Ring -->
  <path d="M135 190 L135 240" stroke="#38BDF8" stroke-width="1.5"/>
  <path d="M300 190 L300 240" stroke="#38BDF8" stroke-width="1.5"/>
  <path d="M465 190 L465 240" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Level 3: 3 Worker VPS (Apps + Galera Cluster Multi-Mestre) -->
  <g id="workers">
    <rect x="70" y="240" width="130" height="90" rx="10" fill="#07192C" stroke="#10B981" stroke-width="1.5"/>
    <text x="82" y="260" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Worker 1</text>
    <text x="82" y="276" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9">Moodle / PHP-FPM</text>
    <text x="82" y="292" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="9">MariaDB Galera #1</text>
    <text x="82" y="312" fill="#34D399" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Multi-Primary ⇄</text>

    <rect x="235" y="240" width="130" height="90" rx="10" fill="#07192C" stroke="#10B981" stroke-width="1.5"/>
    <text x="247" y="260" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Worker 2</text>
    <text x="247" y="276" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9">Moodle / PHP-FPM</text>
    <text x="247" y="292" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="9">MariaDB Galera #2</text>
    <text x="247" y="312" fill="#34D399" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Multi-Primary ⇄</text>

    <rect x="400" y="240" width="130" height="90" rx="10" fill="#07192C" stroke="#10B981" stroke-width="1.5"/>
    <text x="412" y="260" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Worker 3</text>
    <text x="412" y="276" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9">Moodle / PHP-FPM</text>
    <text x="412" y="292" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="9">MariaDB Galera #3</text>
    <text x="412" y="312" fill="#34D399" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Multi-Primary ⇄</text>
  </g>

  <!-- Horizontal Galera Mesh Synch -->
  <line x1="200" y1="290" x2="235" y2="290" stroke="#06B6D4" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="365" y1="290" x2="400" y2="290" stroke="#06B6D4" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- Footer Badge -->
  <rect x="190" y="350" width="220" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="300" y="367" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SMARTNONSTOP • ZERO DOWNTIME</text>
</svg>
