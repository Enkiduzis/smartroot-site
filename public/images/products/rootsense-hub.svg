<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2847" />
      <stop offset="100%" stop-color="#081524" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#p1Grad)"/>
  
  <!-- Hardware Hub Chassis -->
  <g transform="translate(100, 70)">
    <rect x="0" y="40" width="400" height="180" rx="18" fill="#152033" stroke="#2B4063" stroke-width="2"/>
    <rect x="20" y="60" width="360" height="40" rx="8" fill="#0A111C"/>
    
    <!-- LED Array -->
    <circle cx="50" cy="80" r="5" fill="#00D2FF" filter="url(#pGlow)"/>
    <circle cx="80" cy="80" r="5" fill="#10B981" filter="url(#pGlow)"/>
    <circle cx="110" cy="80" r="5" fill="#388BFD"/>
    <circle cx="140" cy="80" r="5" fill="#F59E0B"/>
    <text x="180" y="84" font-family="monospace" font-size="12" fill="#00D2FF">PWR • LORAWAN • MQTT • SYS_OK</text>
    
    <!-- Ports and heat dissipation lines -->
    <line x1="30" y1="140" x2="370" y2="140" stroke="#22334F" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="30" y1="160" x2="370" y2="160" stroke="#22334F" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="30" y1="180" x2="370" y2="180" stroke="#22334F" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- Antennas -->
    <rect x="60" y="0" width="12" height="40" rx="4" fill="#334155"/>
    <rect x="330" y="0" width="12" height="40" rx="4" fill="#334155"/>
    <line x1="66" y1="10" x2="66" y2="30" stroke="#00D2FF" stroke-width="2"/>
    <line x1="336" y1="10" x2="336" y2="30" stroke="#00D2FF" stroke-width="2"/>
    
    <!-- Product Label -->
    <text x="20" y="250" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">RootSense IoT Hub — Modelo R-300</text>
    <text x="20" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Processador Dual-Core com Módulo Criptográfico Integrado</text>
  </g>
</svg>
