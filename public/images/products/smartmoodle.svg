<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07172C"/>
      <stop offset="100%" stop-color="#0F2B48"/>
    </linearGradient>
    <linearGradient id="moodleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Central Sync Bridge Graphic -->
  <!-- Left Box: ERP / Acadêmico -->
  <rect x="70" y="110" width="160" height="180" rx="16" fill="#0B2038" stroke="#0284C7" stroke-width="2" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))"/>
  <rect x="90" y="135" width="40" height="40" rx="10" fill="#0284C7" fill-opacity="0.2"/>
  <path d="M102 162 L102 148 L118 148 L118 162 Z M106 148 L106 142 L114 142 L114 148 Z" fill="#38BDF8"/>
  <text x="90" y="200" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">ERP Acadêmico</text>
  <text x="90" y="222" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Oracle • MySQL</text>
  <text x="90" y="238" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PostgreSQL • SQL Server</text>
  <rect x="90" y="255" width="70" height="18" rx="6" fill="#10B981" fill-opacity="0.2"/>
  <text x="96" y="268" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SINCRONIZADO</text>

  <!-- Right Box: Moodle LMS -->
  <rect x="370" y="110" width="160" height="180" rx="16" fill="#0B2038" stroke="#F97316" stroke-width="2" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))"/>
  <rect x="390" y="135" width="40" height="40" rx="10" fill="#F97316" fill-opacity="0.2"/>
  <text x="402" y="162" fill="#FB923C" font-family="system-ui, sans-serif" font-size="24" font-weight="900">m</text>
  <text x="390" y="200" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Moodle LMS</text>
  <text x="390" y="222" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Cursos • Alunos</text>
  <text x="390" y="238" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Matrículas • Turmas</text>
  <rect x="390" y="255" width="60" height="18" rx="6" fill="#F97316" fill-opacity="0.2"/>
  <text x="396" y="268" fill="#FB923C" font-family="system-ui, sans-serif" font-size="10" font-weight="600">WEB APIs</text>

  <!-- SmartMoodle Connector Engine in Center -->
  <circle cx="300" cy="200" r="44" fill="#07172C" stroke="#38BDF8" stroke-width="3" filter="drop-shadow(0 0 15px rgba(56,189,248,0.4))"/>
  <path d="M230 200 L256 200" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 3"/>
  <path d="M344 200 L370 200" stroke="#FB923C" stroke-width="3" stroke-dasharray="4 3"/>
  
  <!-- Arrow Heads -->
  <polygon points="260,195 270,200 260,205" fill="#38BDF8"/>
  <polygon points="340,195 330,200 340,205" fill="#FB923C"/>
  
  <text x="300" y="195" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">SMART</text>
  <text x="300" y="210" fill="#FB923C" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">MOODLE</text>
  <text x="300" y="222" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">INTEGRATOR</text>

  <!-- Top Badge -->
  <rect x="185" y="45" width="230" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="205" cy="61" r="5" fill="#10B981"/>
  <text x="220" y="66" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Integração ERP &amp; Moodle</text>
</svg>
