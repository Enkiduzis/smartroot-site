<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="saasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A36"/>
      <stop offset="100%" stop-color="#0F2B52"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#saasBg)"/>

  <!-- Main SaaS Dashboard Window -->
  <rect x="60" y="50" width="480" height="300" rx="14" fill="#0D1E36" stroke="#0284C7" stroke-width="1.5" filter="drop-shadow(0 15px 35px rgba(0,0,0,0.5))"/>

  <!-- Window Header -->
  <rect x="60" y="50" width="480" height="36" rx="14" fill="#132B4A"/>
  <circle cx="85" cy="68" r="5" fill="#EF4444"/>
  <circle cx="102" cy="68" r="5" fill="#F59E0B"/>
  <circle cx="119" cy="68" r="5" fill="#10B981"/>
  <text x="300" y="72" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SmartRoot Cloud Platform — Painéis, APIs &amp; SaaS</text>

  <!-- Sidebar -->
  <rect x="75" y="100" width="100" height="235" rx="8" fill="#0A182B"/>
  <rect x="85" y="115" width="80" height="12" rx="4" fill="#0284C7"/>
  <rect x="85" y="140" width="65" height="8" rx="4" fill="#334155"/>
  <rect x="85" y="160" width="70" height="8" rx="4" fill="#334155"/>
  <rect x="85" y="180" width="60" height="8" rx="4" fill="#334155"/>
  <rect x="85" y="200" width="75" height="8" rx="4" fill="#334155"/>

  <!-- Analytics Widgets inside Dashboard -->
  <!-- Stat Card 1 -->
  <rect x="190" y="100" width="105" height="65" rx="8" fill="#132B4A"/>
  <text x="202" y="120" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Requisições API</text>
  <text x="202" y="144" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">1.8M/dia</text>
  <text x="202" y="156" fill="#10B981" font-family="system-ui, sans-serif" font-size="9">↑ 99.99% Uptime</text>

  <!-- Stat Card 2 -->
  <rect x="310" y="100" width="105" height="65" rx="8" fill="#132B4A"/>
  <text x="322" y="120" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Latência Média</text>
  <text x="322" y="144" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">18ms</text>
  <text x="322" y="156" fill="#10B981" font-family="system-ui, sans-serif" font-size="9">Otimizado REST</text>

  <!-- Stat Card 3 -->
  <rect x="430" y="100" width="95" height="65" rx="8" fill="#132B4A"/>
  <text x="442" y="120" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Bancos Escaláveis</text>
  <text x="442" y="144" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Cluster</text>
  <text x="442" y="156" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9">Multi-Region</text>

  <!-- Main Chart Area -->
  <rect x="190" y="180" width="335" height="155" rx="8" fill="#0A182B"/>
  <polyline points="210,300 240,270 280,285 330,230 380,250 430,210 480,200 505,190" fill="none" stroke="#0284C7" stroke-width="3"/>
  <!-- Area under curve -->
  <polygon points="210,300 240,270 280,285 330,230 380,250 430,210 480,200 505,190 505,320 210,320" fill="#0284C7" fill-opacity="0.12"/>
</svg>
